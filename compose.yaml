name: agent-backend-aegra

x-runtime: &runtime
  env_file: .env
  environment: &runtime-env
    AEGRA_CONFIG: /app/aegra.json
    AUTH_TYPE: custom
    ENV_MODE: PRODUCTION
    DEBUG: "false"
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    REDIS_BROKER_ENABLED: "true"
    REDIS_URL: redis://redis:6379/0
    RUN_MIGRATIONS_ON_STARTUP: "false"
    AEGRA_CHECKPOINT_DURABILITY: sync
    SQLALCHEMY_POOL_SIZE: "5"
    SQLALCHEMY_MAX_OVERFLOW: "5"
    LANGGRAPH_MIN_POOL_SIZE: "2"
    LANGGRAPH_MAX_POOL_SIZE: "15"
    REDIS_MAX_CONNECTIONS: "300"
    BG_JOB_TIMEOUT_SECS: "600"
    BG_JOB_MAX_RETRIES: "3"
    WORKER_DRAIN_TIMEOUT: "30"
    CRON_ENABLED: "false"
    FF_V2_EVENT_STREAMING: "false"
    OTEL_TARGETS: ""
    LOG_LEVEL: INFO
    BROKER_URL: http://sandbox-broker:8090
    SANDBOX_MAX_CONCURRENT: ${SANDBOX_CONCURRENCY:-2}
  networks: [backend]

services:
  sandbox-runtime:
    profiles: [build]
    image: agent-backend-sandbox:0.1.0
    build:
      context: .
      dockerfile: deploy/sandbox.Dockerfile

  sandbox-broker:
    image: agent-backend-broker:0.1.0
    build:
      context: .
      dockerfile: deploy/broker.Dockerfile
    environment:
      BROKER_TOKEN: ${BROKER_TOKEN:?Run python scripts/init_env.py first}
      SANDBOX_IMAGE: agent-backend-sandbox:0.1.0
      SANDBOX_CONCURRENCY: ${SANDBOX_CONCURRENCY:-2}
      DOCKER_SOCKET: /var/run/docker.sock
    volumes: [/var/run/docker.sock:/var/run/docker.sock]
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8090/health',headers={'Authorization':'Bearer '+os.environ['BROKER_TOKEN']}); urllib.request.urlopen(r,timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agents}
      POSTGRES_USER: ${POSTGRES_USER:-agents}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/init_env.py first}
    command: [postgres, -c, max_connections=150]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [backend]

  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec, --maxmemory-policy, noeviction]
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [backend]

  migrate:
    <<: *runtime
    image: agent-backend-api:0.1.0
    build: .
    command: [python, -m, agent_backend.migrate]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  api:
    <<: *runtime
    image: agent-backend-api:0.1.0
    build: .
    deploy:
      replicas: ${API_REPLICAS:-2}
    depends_on:
      migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      sandbox-broker: {condition: service_healthy}
    expose: ["2026"]
    stop_grace_period: 50s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:2026/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  gateway:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:${HOST_PORT:-2026}:8080"]
    volumes: [./deploy/nginx.conf:/etc/nginx/nginx.conf:ro]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    networks: [backend]

networks:
  backend:

volumes:
  postgres_data:
  redis_data:
