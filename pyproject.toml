[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-backend"
version = "0.1.0"
description = "Forge Coding Agent with an owned decision loop, durable jobs, code retrieval and isolated verification"
requires-python = ">=3.12,<3.15"
dependencies = [
  "aegra-api==0.10.8",
  "aegra-cli==0.10.8",
  "langchain-openai>=1.1.14,<2",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_backend = ["studio/*.html", "studio/*.css", "studio/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py312"
line-length = 110
# Preserve the exact upstream source bytes used by the frozen evaluator.
extend-exclude = ["benchmarks/*/oracle/reference_files"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
