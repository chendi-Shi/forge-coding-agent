worker_processes auto;
events { worker_connections 4096; }
http {
    # Docker DNS refresh allows replicas to be replaced without stale upstreams.
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream agent_api {
        zone agent_api 64k;
        least_conn;
        server api:2026 resolve max_fails=3 fail_timeout=5s;
        keepalive 64;
        # Expire idle sockets before Uvicorn's default 5-second timeout.
        keepalive_timeout 2s;
    }
    server {
        listen 8080;
        client_max_body_size 24m;
        location / {
            proxy_pass http://agent_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 650s;
            # Safe reads may fail over. Deliberately omit non_idempotent:
            # nginx must not replay a POST/PATCH already sent upstream.
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
        }
    }
}
